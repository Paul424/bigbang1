---
apiVersion: v1alpha1
kind: HostnameConfig
auto: off
hostname: talos-ai1
---
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
    nvidia.com/gpu.present: "true"
---
apiVersion: v1alpha1
kind: VLANConfig
name: ens18.20
vlanID: 20
vlanMode: 802.1q
parent: ens18
up: true
addresses:
  - address: 192.168.20.26/24
routes:
    - gateway: 192.168.20.1
---
apiVersion: v1alpha1
kind: VLANConfig
name: ens18.30
vlanID: 30
vlanMode: 802.1q
parent: ens18
up: true
addresses:
  - address: 192.168.30.26/24
routes:
  - gateway: 192.168.30.1
    table: 30
    metric: 100
# ---
# apiVersion: v1alpha1
# kind: RoutingRuleConfig
# name: "1000"
# src: 192.168.30.0/24
# table: 30
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
    image: factory.talos.dev/metal-installer/914b38adefad3d77212f565745ed52013bf3a424e7da2730e9e7dad8ee297342:v1.14.2 # Allows for supplying the image used to perform the installation.
provisioning:
    diskSelector:
        match: disk.dev_path == "/dev/sda"
    wipe: false
---
version: v1alpha1
machine:
  kernel:
    modules:
      - name: nvidia
      - name: nvidia_uvm
      - name: nvidia_drm
      - name: nvidia_modeset
