apiVersion: v1alpha1
kind: DHCPv4Config
name: ens18 # Name of the link (interface).

# # Raw value of the DUID to use as client identifier.
# duidRaw: 00:01:00:01:23:45:67:89:ab:cd:ef:01:23:45
---
apiVersion: v1alpha1
kind: VLANConfig
name: ens18.30 # Name of the VLAN link (interface) to be created.
vlanID: 30 # VLAN ID to be used for the VLAN link.
vlanMode: 802.1q # Set the VLAN mode to use.
parent: ens18 # Name of the parent link (interface) on which the VLAN link will be created.
up: true # Bring the link up or down.
