apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
- behavior: merge
  files:
  - values.yaml=config.yaml
  name: environment

resources:
- ../base
- secrets/dev-bb-secret.enc.yaml

patches:
# # Enable the line below if a secrets.enc.yaml is created in this directory
# - path: secrets.enc.yaml
- patch: |-
    apiVersion: source.toolkit.fluxcd.io/v1
    kind: GitRepository
    metadata:
      name: bigbang
    spec:
      interval: 1m
  # Use the following three lines to test a new version of Big Bang without affecting other environments
  #   ref:
  #     $patch: replace
  #     tag: "3.7.0"
- patch: |-
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: bigbang
    spec:
      interval: 1m
      valuesFrom:
        - kind: Secret
          name: common-bb
        - kind: ConfigMap
          name: common
        - kind: ConfigMap
          name: environment
        - kind: Secret
          name: dev-bb-secret
      postRenderers:
      - kustomize:
          patches:
          - target:
              kind: HelmRelease
              name: gitlab
            patch: |-
              - op: add
                path: /spec/dependsOn/-
                value:
                  name: rook-ceph-cluster-config
                  namespace: rook-ceph
          - target:
              kind: HelmRelease
              name: monitoring
            patch: |-
              - op: add
                path: /spec/dependsOn/-
                value:
                  name: rook-ceph-cluster
                  namespace: rook-ceph
          - target:
              kind: HelmRelease
              name: rook-ceph-wrapper
            patch: |-
              - op: remove
                path: /spec/dependsOn/1
          - target:
              kind: HelmRelease
              name: keycloak
            patch: |-
              - op: add
                path: /spec/dependsOn/-
                value:
                  name: rook-ceph-cluster
                  namespace: rook-ceph
          - target:
              kind: HelmRelease
              name: public-ingressgateway
            patch: |-
              - op: add
                path: /spec/dependsOn/-
                value:
                  name: metallb-config
                  namespace: metallb
          - target:
              kind: HelmRelease
              name: passthrough-ingressgateway
            patch: |-
              - op: add
                path: /spec/dependsOn/-
                value:
                  name: metallb-config
                  namespace: metallb
