---
apiVersion: v1alpha1
kind: KubeAdmissionControlConfig
name: PodSecurity
configuration:
    apiVersion: pod-security.admission.config.k8s.io/v1alpha1
    defaults:
        audit: restricted
        audit-version: latest
        # enforce: baseline
        enforce: privileged
        enforce-version: latest
        warn: restricted
        warn-version: latest
    exemptions:
        namespaces:
            - kube-system
        runtimeClasses: []
        usernames: []
    kind: PodSecurityConfiguration
---
apiVersion: v1alpha1
kind: KubeAuthenticationConfig
configuration:
    # anonymous:
    #     conditions:
    #         - path: /livez
    #         - path: /readyz
    #         - path: /healthz
    #     enabled: true
    jwt:
    - issuer:
        url: https://keycloak.dev.bigbang.mil/auth/realms/me-yoda
        audiences:
        - kind-headlamp
        - kubernetes
        audienceMatchPolicy: MatchAny
      claimMappings:
        username:
          claim: preferred_username
          prefix: ""
        groups:
          claim: groups
          prefix: ""
      claimValidationRules: []
---
apiVersion: v1alpha1
kind: ResolverConfig
# A list of nameservers (DNS servers) to use for resolving domain names.
nameservers:
    - address: 192.168.30.150 # The IP address of the bind9 nameserver.
    - address: 192.168.50.1 # The IP address of the nameserver.
---
apiVersion: v1alpha1
kind: DHCPv4Config
name: ens18
---
apiVersion: v1alpha1
kind: VLANConfig
name: ens18.30
vlanID: 30
vlanMode: 802.1q
parent: ens18
up: true
